[package]
name = "charturbo-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgl"]
# WebGL2 fallback (wgpu GLES backend + WGSL -> GLSL translation): ~58% of the wasm. The
# WebGPU-only build (`--no-default-features`) drops it; its WebGL2 requests fail with
# "No suitable GPU adapter found" and the SDK loads the full build instead.
webgl = ["wgpu/webgl"]

[dependencies]
bytemuck = { version = "1.18", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wgpu = "24"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Window",
  "Element",
  "HtmlCanvasElement",
  "ImageBitmap",
  "CanvasRenderingContext2d",
  "Performance",
  "console",
]

[dev-dependencies]
# Same naga as wgpu 24: validates every WGSL shader natively in `cargo test` (+ GLSL ES for WebGL2)
naga = { version = "24", features = ["wgsl-in", "glsl-out"] }
