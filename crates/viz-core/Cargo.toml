[package]
name = "viz-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.18", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wgpu = { version = "24", features = ["webgl"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Window",
  "Element",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Performance",
  "console",
]

[dev-dependencies]
# Same naga as wgpu 24: validates every WGSL shader natively in `cargo test` (+ GLSL ES for WebGL2)
naga = { version = "24", features = ["wgsl-in", "glsl-out"] }
