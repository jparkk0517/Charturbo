<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>charturbo visual fixtures</title>
    <style>
      html, body { margin: 0; padding: 0; background: #808080; overflow: hidden; }
      /* Fixed origin: screenshots clip the card at (16, 16) */
      #card { position: relative; display: inline-block; margin: 16px; }
      .spark-grid { display: grid; grid-template-columns: repeat(4, 140px); gap: 8px; padding: 8px; }
      /* Canvas-only shot: every overlay node (labels, legend, colorbar, tooltip) hidden */
      body.canvas-only #card > :not(canvas):not(.spark-grid) { visibility: hidden !important; }
      * { caret-color: transparent; }
    </style>
  </head>
  <body>
    <div id="card"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
